# Dependabot PRs still go through read-only CI checks; production signing
# secrets are never passed to pull_request builds.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      gradle:
        patterns:
          - "*"
