name: One-time Git author email privacy rewrite

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/history-email-cleanup.yml

permissions: {}

jobs:
  rewrite:
    name: Rewrite and validate all branch/tag histories
    if: github.repository == 'farhan2166-creator/Split-Android' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      EXPECTED_OLD_HEAD: '60b1a76f55882b5bc6455624bebfebb63615a98a'
      EXPECTED_OLD_TREE: '5017ed29e9f25281bd6d8deffd9d2196d3327aaf'
      PRIVATE_TO_NOREPLY: '316891609+farhan2166-creator@users.noreply.github.com'
      GH_PUSH_TOKEN: ${{ github.token }}
      EXPECTED_WORKFLOW_HEAD: ${{ github.sha }}
    steps:
      - name: Rewrite and verify without modifying remote
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/filter-env"
          "$RUNNER_TEMP/filter-env/bin/pip" install --disable-pip-version-check --quiet 'git-filter-repo==2.47.0'
          export PATH="$RUNNER_TEMP/filter-env/bin:$PATH"
          git clone --bare --quiet "https://github.com/${GITHUB_REPOSITORY}.git" repo.git
          cd repo.git
          test "$(git rev-parse refs/heads/main)" = "$EXPECTED_WORKFLOW_HEAD" || {
            echo '::error::Main changed after cleanup workflow was committed; refusing force-push.'
            exit 1
          }
          git merge-base --is-ancestor "$EXPECTED_OLD_HEAD" refs/heads/main
          git diff --quiet "$EXPECTED_OLD_HEAD" refs/heads/main -- . ':(exclude).github/workflows/history-email-cleanup.yml'
          test "$(git rev-parse "$EXPECTED_OLD_HEAD^{tree}")" = "$EXPECTED_OLD_TREE"
          git for-each-ref --format='%(refname) %(objectname)' refs/heads refs/tags > ../original-refs.txt
          git for-each-ref --format='%(refname)' refs/heads refs/tags > ../original-names.txt
          while read -r ref old; do
            printf '%s %s\n' "$ref" "$(git rev-parse "$ref^{tree}")"
          done < ../original-refs.txt > ../original-trees.txt
          original_count=$(git rev-list --count --all)
          original_identifiable=$(git log --all --format='%ae%n%ce' | grep -ic '@gmail\.com$' || true)
          test "$original_identifiable" -gt 0
          git filter-repo --force --replace-refs delete-no-add \
            --prune-empty never --prune-degenerate never \
            --email-callback 'return b"316891609+farhan2166-creator@users.noreply.github.com" if email.lower().endswith(b"@gmail.com") else email'
          git for-each-ref --format='%(refname)' refs/heads refs/tags > ../rewritten-names.txt
          diff -u ../original-names.txt ../rewritten-names.txt
          test "$(git rev-list --count --all)" = "$original_count" || {
            echo '::error::Commit count changed. The history rewrite was not published.'
            exit 1
          }
          while read -r ref tree; do
            test "$(git rev-parse "$ref^{tree}")" = "$tree" || {
              echo "::error::Source files changed in $ref; aborting."
              exit 1
            }
          done < ../original-trees.txt
          if git log --all --format='%ae%n%ce' | grep -iq '@gmail\.com$'; then
            echo '::error::Identifiable commit email remains after rewrite.'
            exit 1
          fi
          if git for-each-ref --format='%(taggeremail)' refs/tags | grep -iq '@gmail\.com'; then
            echo '::error::Identifiable annotated-tag email remains after rewrite.'
            exit 1
          fi
          printf '### Verified rewritten Git history\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf '%s commits; %s branches; %s tags. All source trees are unchanged.\n' \
            "$original_count" "$(git for-each-ref --count=1000 refs/heads | wc -l)" \
            "$(git for-each-ref --count=1000 refs/tags | wc -l)" >> "$GITHUB_STEP_SUMMARY"

      - name: Atomically publish rewritten branches and release tags
        shell: bash
        run: |
          set -euo pipefail
          cd repo.git
          push_options=(--atomic)
          push_refs=()
          while read -r ref expected_sha; do
            push_options+=("--force-with-lease=$ref:$expected_sha")
            push_refs+=("$ref:$ref")
          done < ../original-refs.txt
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_PUSH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$auth_header" push "${push_options[@]}" origin "${push_refs[@]}"
          {
            echo '### Completed author-email history rewrite'
            echo 'All branches and existing release-tag names were updated in one atomic push.'
            echo 'Old commit SHA URLs, cached objects, previous clones and Actions logs may retain original metadata.'
          } >> "$GITHUB_STEP_SUMMARY"
