name: Android CI and APK
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled Android SDK
        run: |
          test -d "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test and compile
        run: gradle --no-daemon -PsplitCiRunNumber="$GITHUB_RUN_NUMBER" testDebugUnitTest assembleDebug
      - name: Package versioned APK and checksum
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION="$(grep '^VERSION_' version.properties | cut -d= -f2 | paste -sd '.' -)"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Split-${VERSION}-build${GITHUB_RUN_NUMBER}-debug.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          echo "Split ${VERSION}, build ${GITHUB_RUN_NUMBER}" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Split-Android-${{ github.run_number }}
          path: dist/
          retention-days: 30
