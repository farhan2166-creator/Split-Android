name: Android Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish signed APK as a GitHub Release
        required: true
        type: boolean
        default: false
      release_title:
        description: Optional GitHub Release title
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: split-signed-release
  cancel-in-progress: false

jobs:
  signing-check:
    name: Check production signing setup
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check release signing secrets
        id: check
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "All four release signing secrets are configured." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Release signing is not yet configured. Automatic release build is skipped; configure the four Android signing secrets." >> "$GITHUB_STEP_SUMMARY"
          fi

  release-apk:
    name: Build signed release APK
    needs: signing-check
    if: github.ref == 'refs/heads/main' && (needs.signing-check.outputs.ready == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version_name: ${{ steps.package.outputs.version_name }}
    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure private release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing signing secret: $key"
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release-signing.jks
          test -s release-signing.jks
          {
            printf 'storeFile=release-signing.jks\n'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > signing.properties
          chmod 600 signing.properties release-signing.jks

      - name: Test and build signed release APK
        shell: bash
        run: |
          set -euo pipefail
          BUILD_SEQUENCE=$((1000 + $(git rev-list --count HEAD) + GITHUB_RUN_NUMBER + GITHUB_RUN_ATTEMPT - 1))
          test "$BUILD_SEQUENCE" -le 9999
          echo "Rebuild version sequence: $BUILD_SEQUENCE"
          gradle --no-daemon -PsplitCiRunNumber="$BUILD_SEQUENCE" testDebugUnitTest assembleRelease

      - name: Verify release signature and package APK
        id: package
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -x "$AAPT" && test -x "$SIGNER"
          "$SIGNER" verify --verbose "$apk"
          BADGING="$("$AAPT" dump badging "$apk" | head -n 1)"
          echo "$BADGING"
          [[ "$BADGING" == *"name='com.mythos.split'"* ]]
          VERSION="$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          test -n "$VERSION"
          echo "version_name=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          cp "$apk" "dist/Split-Android-v${VERSION}-release.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          echo "### Signed Split Android release v$VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "APK and SHA256 checksum are available in the downloadable artifact." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary signing files
        if: always()
        shell: bash
        run: rm -f release-signing.jks signing.properties

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Split-Android-release-${{ github.run_number }}-a${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish GitHub Release
    needs: release-apk
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release APK
        uses: actions/download-artifact@v4
        with:
          name: Split-Android-release-${{ github.run_number }}-a${{ github.run_attempt }}
          path: dist

      - name: Verify checksum
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check SHA256SUMS.txt)

      - name: Publish downloadable signed APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.release-apk.outputs.version_name }}
          RELEASE_TITLE: ${{ inputs.release_title }}
        run: |
          set -euo pipefail
          tag="split-v${VERSION}-run${GITHUB_RUN_NUMBER}-a${GITHUB_RUN_ATTEMPT}"
          title="${RELEASE_TITLE:-Split Android v$VERSION}"
          gh release create "$tag" dist/*-release.apk dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "$title" \
            --notes "Signed Split Android APK for com.mythos.split (v$VERSION). SHA256 checksum included."
