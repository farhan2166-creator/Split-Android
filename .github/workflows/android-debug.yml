name: Android Debug APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: split-debug-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  debug-apk:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Avoid exposing the checkout token to Gradle or untrusted PR scripts.
          persist-credentials: false

      - name: Check public repository for tracked secrets
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_repository_safety.py

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Test and compile debug APK
        shell: bash
        run: |
          set -euo pipefail
          BUILD_SEQUENCE=$((1000 + $(git rev-list --count HEAD) + GITHUB_RUN_NUMBER + GITHUB_RUN_ATTEMPT - 1))
          test "$BUILD_SEQUENCE" -le 9999
          echo "Rebuild version sequence: $BUILD_SEQUENCE"
          gradle --no-daemon -PsplitCiRunNumber="$BUILD_SEQUENCE" testDebugUnitTest assembleDebug

      - name: Verify APK and package checksum
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -x "$AAPT" && test -x "$SIGNER"
          "$SIGNER" verify "$apk"
          BADGING="$("$AAPT" dump badging "$apk" | head -n 1)"
          echo "$BADGING"
          [[ "$BADGING" == *"name='com.mythos.split'"* ]]
          VERSION="$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          test -n "$VERSION"
          mkdir -p dist
          cp "$apk" "dist/Split-Android-v${VERSION}-debug.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          echo "### Split Android debug v$VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "The Actions artifact is ZIP-wrapped by GitHub. For a **direct .apk download**, open the debug pre-release linked below when the publishing job finishes." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: Split-Android-debug-${{ github.run_number }}-a${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish-direct-apk:
    name: Publish direct debug APK
    needs: debug-apk
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download tested APK artifact
        uses: actions/download-artifact@v6
        with:
          name: Split-Android-debug-${{ github.run_number }}-a${{ github.run_attempt }}
          path: dist

      - name: Verify APK integrity
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check SHA256SUMS.txt)
          shopt -s nullglob
          files=(dist/*.apk)
          test "${#files[@]}" -eq 1

      - name: Publish directly downloadable APK to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.apk)
          test "${#files[@]}" -eq 1
          apk="${files[0]}"
          name="${apk##*/}"
          tag="split-debug-run${GITHUB_RUN_NUMBER}-attempt${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" "$apk" dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "Split Android Debug APK · build ${GITHUB_RUN_NUMBER}" \
            --prerelease \
            --notes "Directly downloadable debug APK (com.mythos.split). Built and tested in GitHub Actions. Not production-signed."
          echo "### Download APK directly" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download **$name**](https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$name)" >> "$GITHUB_STEP_SUMMARY"
          echo "No ZIP extraction needed. This is a debug APK; do not replace a separately signed app without preserving its data." >> "$GITHUB_STEP_SUMMARY"
