name: '03 - CI - Android Lint'

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'version.properties'
      - '.github/workflows/android-quality.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'version.properties'
      - '.github/workflows/android-quality.yml'

permissions:
  contents: read

concurrency:
  group: split-lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Android lint (debug)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platform
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME"
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$sdkmanager"
          "$sdkmanager" --install "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-provider: basic

      - name: Run Android lint
        run: gradle --no-daemon :app:lintDebug

      - name: Upload lint report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: split-lint-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7
