name: '03 - CI - Secret Scanning'

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-secrets-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan-git-history:
    name: Scan complete history for secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download checksum-pinned Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$scanner_dir"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$scanner_dir/archive.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $scanner_dir/archive.tar.gz" | sha256sum --check --status
          tar -xzf "$scanner_dir/archive.tar.gz" -C "$scanner_dir" gitleaks
          chmod 755 "$scanner_dir/gitleaks"

      - name: Scan all Git refs for secrets without exposing values
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --is-shallow-repository)" = "false"
          "$RUNNER_TEMP/gitleaks/gitleaks" git . --log-opts=--all --redact --no-banner
